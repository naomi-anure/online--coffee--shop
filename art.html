<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
      ul {


 padding: 20px;
            margin: 50px;
           
            font-family: sans-serif;
            font-size: large;
            font-style: italic;
            display:flex;
            justify-content: space-around;
            text-transform:capitalize;
            color:greenyellow;
        }

        .capital{
            border: 5px solid green;
            size:50px;
            width: 20%;
            height: 20px;
            background-color: greenyellow;
            border-radius:50px;
            background:linear-gradient(100deg, greenyellow, red);
        }

       .pen{
        flex:1;
        background-size: cover;
        background-position:center;
        border-radius: 20px;
        cursor:pointer;
        background: black;
        filter:grayscale(80%);
        transition:flex 0.6s cubic-bezier(0.075, 0.82, 0.165, 1)
       }
    </style>
</head>
<body>
   <div class="epic">
    <ul>
        <li><a href="#"> HOME</a></li>
        <li><a href="#">CONTACTS</a></li>
        <li><a href="#">COMPUTER</a></li>
       <li><a href="#">BISCUIT</a></li>
    </ul>
   </div> 

   <div class="capital"></div>
   <div class="pen"></div>
   <div class="pen"></div>
   <div class="pen"></div>
</body>
</html>
